<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <linearGradient id="dcd-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2187A"/>
      <stop offset="0.55" stop-color="#6A1B9A"/>
      <stop offset="1" stop-color="#3B0F6B"/>
    </linearGradient>
    <linearGradient id="dcd-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E23C93"/>
      <stop offset="0.5" stop-color="#FF6FB5"/>
      <stop offset="1" stop-color="#E23C93"/>
    </linearGradient>
    <radialGradient id="dcd-flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#FFF4B8"/>
      <stop offset="0.45" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#F28A1C"/>
    </radialGradient>
    <radialGradient id="dcd-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC24D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC24D" stop-opacity="0"/>
    </radialGradient>
    <filter id="dcd-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#3B0F6B" flood-opacity="0.22"/>
    </filter>

    <g id="dcd-diya">
      <circle cx="0" cy="-17" r="17" fill="url(#dcd-glow)"/>
      <path d="M0,-31 C6,-21 7.5,-13 0,-6.5 C-7.5,-13 -6,-21 0,-31 Z" fill="url(#dcd-flame)"/>
      <g filter="url(#dcd-shadow)">
        <path d="M-35,-1 Q-31,27 0,29 Q31,27 35,-1 Q0,9 -35,-1 Z" fill="url(#dcd-bowl)"/>
        <ellipse cx="0" cy="-1.5" rx="35" ry="7" fill="url(#dcd-rim)"/>
        <ellipse cx="0" cy="-1.8" rx="27" ry="3.8" fill="#7A1560"/>
        <path d="M-31,9 Q0,19 31,9" fill="none" stroke="#F2B544" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-27,15.5 Q0,24 27,15.5" fill="none" stroke="#F2B544" stroke-width="1.1" stroke-dasharray="1.5 3" stroke-linecap="round"/>
        <g fill="#2EC4B6">
          <circle cx="-20" cy="12.3" r="1.7"/><circle cx="-10" cy="13.8" r="1.7"/><circle cx="0" cy="14.2" r="1.9"/>
          <circle cx="10" cy="13.8" r="1.7"/><circle cx="20" cy="12.3" r="1.7"/>
        </g>
        <ellipse cx="0" cy="29.5" rx="8" ry="2.4" fill="#F2B544"/>
      </g>
    </g>

    <g id="dcd-flower-a">
      <g fill="#B5179E">
        <ellipse cx="0" cy="-9" rx="5" ry="9"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(45)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(90)"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(135)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(180)"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(225)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(270)"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(315)"/>
      </g>
      <circle r="8.5" fill="#F2B544"/>
      <circle r="6.5" fill="#6A1B9A"/>
      <circle r="3.6" fill="#2EC4B6"/>
    </g>
    <g id="dcd-flower-b">
      <g fill="#2EC4B6">
        <ellipse cx="0" cy="-9" rx="5" ry="9"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(45)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(90)"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(135)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(180)"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(225)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(270)"/><ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(315)"/>
      </g>
      <circle r="8.5" fill="#E23C93"/>
      <circle r="6" fill="#7B2CBF"/>
      <circle r="2.8" fill="#F2B544"/>
    </g>
  </defs>

  <g id="dcd-art" transform="translate(200 0) scale(-1 1)">
    <g stroke="#E0A44A" stroke-width="1.4" stroke-dasharray="1.2 4" stroke-linecap="round">
      <line x1="40" y1="0" x2="40" y2="110"/>
      <line x1="112" y1="0" x2="112" y2="52"/>
      <line x1="170" y1="0" x2="170" y2="160"/>
    </g>
    <use href="#dcd-flower-a" transform="translate(16 26) scale(1.05)" filter="url(#dcd-shadow)"/>
    <use href="#dcd-flower-b" transform="translate(100 175) scale(0.95)" filter="url(#dcd-shadow)"/>
    <use href="#dcd-flower-a" transform="translate(84 152) scale(0.6)" filter="url(#dcd-shadow)"/>
    <use href="#dcd-diya" transform="translate(40 142) scale(0.95)"/>
    <use href="#dcd-diya" transform="translate(112 84) scale(0.85)"/>
    <use href="#dcd-diya" transform="translate(170 192) scale(0.9)"/>
  </g>
</svg>
